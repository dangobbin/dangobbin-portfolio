<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daniele Gobbin — photographer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Lato:wght@100;900&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <a href="#top" class="logo">
    <span class="logo-name">Daniele Gobbin</span> <span class="logo-role">photographer</span>
  </a>
  <nav class="site-nav">
    <a class="navlink" href="by-decade.html">By decade</a>
    <a class="navlink" href="#">Work</a>
    <a class="navlink" href="#">Bio</a>
    <a class="navlink" href="#">Contact</a>
  </nav>
</header>

<section id="top" class="stage">
  <figure class="carousel-figure">
    <div class="carousel-frame">
      <img id="carousel-img" src="" alt="">
    </div>
    <div class="carousel-foot">
      <div class="carousel-caption-row">
        <figcaption id="carousel-caption" class="carousel-caption"></figcaption>
        <span id="carousel-serial" class="carousel-serial"></span>
      </div>
      <div class="carousel-controls">
        <button id="carousel-toggle" class="carousel-btn" type="button" aria-label="Pause slideshow">⏸</button>
        <button id="carousel-next" class="carousel-btn" type="button" aria-label="Next photo">⏭</button>
      </div>
    </div>
  </figure>
</section>

<script src="script.js"></script>
</body>
</html>
